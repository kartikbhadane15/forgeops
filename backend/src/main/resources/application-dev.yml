spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forgeops}
    username: ${DB_USERNAME:forgeops}
    password: ${DB_PASSWORD:forgeops_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.forgeops: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
